# Plugin Settings
plugin:
  debugMode: false
  joinSpawn:
    world: "world"

boss:
  hubWorldId: "boss_hub"

# Database Settings
database:
  # SQL Server Settings
  sqlserver:
    enabled: true
    ipAddress: "localhost"
    port: 1433
    database: "AstralRecord"
    encrypt: true
    trustServerCertificate: true
    user: "sa"
    password: "your_password"

  # File Database Settings
  file:
    rootPath: "filebase"

  # Connection Pool Settings
  pool:
    maxPoolSize: 10
    minIdle: 5
    connectionTimeout: 30000

# AstralRecord API Settings
api:
  # APIのベースURL
  baseUrl: "https://api.astralrecord.example.com"
  # Webログインチャレンジ発行元として API に送信するサーバー ID
  serverId: "main"
  # APIキー認証情報
  auth:
    apiKey: "your_api_key"
  # タイムアウト設定（ミリ秒）
  timeout: 30000
  ssl:
    # SSL証明書の検証を行うか否か
    # 自己署名証明書や内部CA証明書を使用している場合は false に設定してください
    verifyEnabled: true

# Resource Pack Settings
resourcePack:
  enabled: false
  url: "https://example.com/resourcepack/AstralRecordResourcePack.zip"
  sha1: ""
  force: false
  prompt: "Please apply the AstralRecord resource pack."
  skipBedrock: true
  bedrockNamePrefixes:
    - "."
    - "*"


# Logging Settings
logging:
  # ANSIカラーコードを使用するか否か（標準ターミナル向け）
  # Crafty Controller を使用する場合は false に設定してください
  useAnsiColors: false
  # Crafty Controller の Webコンソール向けカラー表示を有効にするか否か
  # jansi を回避して FileDescriptor.out へ直接 UTF-8 で書き込みます
  craftyControllerColors: true
  audit:
    enabled: true
  entry:
    ConsoleLogEntry: true
