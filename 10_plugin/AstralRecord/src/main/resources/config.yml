# Plugin Settings
plugin:
  debugMode: false
  # UUIDs allowed to use only /user permission without permission 99.
  debugUsers: []
  # UUIDs allowed to join during whitelist maintenance without debug permissions.
  whitelistUsers: []
  whitelistEnabled: false
  joinSpawn:
    # WorldMasterData ID. The vanilla server world is not a join-spawn master.
    world: "starlit_nox"

# Player connection capacity
# maxPlayers is reserved for PLAYER. donorExtraPlayers can be used by DONOR and ADMIN,
# and adminExtraPlayers can be used by ADMIN only.
playerCapacity:
  maxPlayers: 30
  donorExtraPlayers: 5
  adminExtraPlayers: 1

skilltree:
  worldName: "plugins/AstralRecord/worlds/hub/skill_tree"
  structureId: "starter"
  center:
    x: 1000
    y: 65
    z: 1000

boss:
  hubWorldId: "skyhaven_isle"

# Boss／Dungeon instance creation limits
# normalLimit is reserved for ordinary requests. reservedLimit is a finite
# donor-only pool and is never an unlimited bypass.
# Donor classification uses the cached UserPermission.DONOR (5); it is not configurable here.
instanceLimits:
  boss:
    normalLimit: 2
    reservedLimit: 1
  dungeon:
    normalLimit: 3
    reservedLimit: 1

# Database Settings
database:
  # SQL Server Settings
  sqlserver:
    enabled: true
    ipAddress: "localhost"
    port: 1433
    database: "AstralRecord"
    encrypt: true
    trustServerCertificate: true
    user: "sa"
    password: "your_password"

  # File Database Settings
  file:
    rootPath: "filebase"

  # Connection Pool Settings
  pool:
    maxPoolSize: 10
    minIdle: 5
    connectionTimeout: 30000

# AstralRecord API Settings
api:
  # APIのベースURL
  baseUrl: "https://api.astralrecord.example.com"
  # Webログインチャレンジ発行元として API に送信するサーバー ID
  serverId: "main"
  # APIキー認証情報
  auth:
    apiKey: "your_api_key"
  # タイムアウト設定（ミリ秒）
  timeout: 30000
  ssl:
    # SSL証明書の検証を行うか否か。false は debug mode または localhost/private IP の開発 endpoint のみ許可
    # 公開 endpoint で false の場合は API key 送信前にクライアント生成を拒否して Plugin 起動を失敗させる
    # 自己署名証明書や内部CA証明書を使用している場合は false に設定してください
    verifyEnabled: true

# リソースパック設定
resourcePack:
  enabled: false
  url: "https://example.com/resourcepack/AstralRecordResourcePack.zip"
  sha1: ""
  force: false
  prompt: "AstralRecord のリソースパックを適用してください。"
  skipBedrock: true
  bedrockNamePrefixes:
    - "."
    - "*"

# DiscordSRV integration. The bot token is managed only by DiscordSRV's own config.yml.
discord:
  enabled: true
  globalChannelId: "1540365856956088331"
  maxMessageLength: 256


# Logging Settings
logging:
  # ANSIカラーコードを使用するか否か（標準ターミナル向け）
  # Crafty Controller を使用する場合は false に設定してください
  useAnsiColors: false
  # Crafty Controller の Webコンソール向けカラー表示を有効にするか否か
  # jansi を回避して FileDescriptor.out へ直接 UTF-8 で書き込みます
  craftyControllerColors: true
  audit:
    enabled: true
  entry:
    ConsoleLogEntry: true
