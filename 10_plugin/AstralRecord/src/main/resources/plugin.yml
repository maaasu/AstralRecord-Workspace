name: AstralRecord
version: ${project.version}
main: io.github.maaasu.astralRecord.AstralRecord
api-version: '1.21'
authors: [ "AstralRecord" ]
depend: [ProtocolLib]
softdepend: [PlugMan]

dependencies:
  server:
    ProtocolLib:
      load: BEFORE
      required: true
    PlugMan:
      load: BEFORE
      required: false

joinSpawn:
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
