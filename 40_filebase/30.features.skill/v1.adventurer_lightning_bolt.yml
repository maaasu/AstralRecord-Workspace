tags:
  - active
  - magic
  - adventurer
  - lightning
# behavior:
#   projectile: "視線方向へ射程14m、速度2.8m/tick、当たり半径0.45mの非貫通雷撃を放ち、最初のMob 1体へ命中する。Blockまたは最大射程で追加効果は発生しない。"
#   primary: "最初の命中対象へMAGIC/LIGHTNINGの主倍率を1回だけ適用する。主対象が感電中である必要はない。"
#   chain: "主対象から水平半径5m・上下5m以内、かつ視線遮蔽のないMobを距離順・UUID順に確認し、SHOCKED中の別対象だけ最大2体へ連鎖倍率を1回適用する。"
#   condition: "ライトニングボルト自身はSHOCKEDを付与しない。連鎖対象からの再連鎖、同一発動内の再命中、PvP/NPC対象はない。"
params:
