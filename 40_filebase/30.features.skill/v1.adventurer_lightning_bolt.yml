    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
  - level: 3
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
  - level: 4
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
  - level: 5
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
sigilSlotsByLevel:
  - { level: 1, slots: 1 }
  - { level: 3, slots: 2 }
  - { level: 5, slots: 3 }
