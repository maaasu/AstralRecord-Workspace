# behavior:
#   projectile: "発動時の照準方向へ射程16mを飛翔する、重力なし・非貫通の氷球。最初の敵または地形ブロックへ衝突すると消滅し、最大射程へ無衝突で到達した場合は炸裂せず消滅する。"
#   impact: "衝突地点を中心に半径radius、上下radiusの範囲から最大maxTargets体へ、中心・外周で差のないICE属性の魔法攻撃を1回与える。命中時freezeChance%でfreezeDurationTicks tickのFROZENを付与し、持続エリアとノックバックは発生させない。"
#   targets: "Mobのみを対象にし、NPCとPvP対象を含めない。Bossは対象になるが、FROZENは共通CONTROL補正で設定持続時間の25%を実適用する。中心から対象へのブロック遮蔽がある敵は命中しない。"
