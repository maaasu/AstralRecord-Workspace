  - "&b【攻撃】 &f射程{skill.range}m、最大{skill.maxHits}体を貫く&b無属性&fダメージ。基礎は&b間接攻撃力&f{skill.effectiveDamageRatio:percent}%。"
  - "&b【攻撃】 &f自分の&d霊印&f1層ごとに倍率を{skill.markDamageRatio:percent}%加算し、有効命中した対象の&d霊印&fだけ全層消費する。"
  - "&6【制限】 &f発動時に消費・クールダウンが始まり、主手の持ち替えや死亡等で中断しても返還しない。"
