      - "&6【継承】 &f通常攻撃が敵へ有効命中したときだけ追撃する。地形・回避では消費しない。"
      - "&6【継承】 &f追撃のダメージは継承の心得の倍率に従う。"
      - "&6【継承】 &f追撃1回につき残り時間を{skill.inheritanceConsumptionTicks:seconds}秒消費する。"
      - "&6【継承】 &f追撃時はこのスキルのリソースを再消費。足りない場合は発動・消費しない。"
