#   shield: "発動者の現在Shieldが2以上のとき半分を消費し、各対象へ同じ量の一時Shieldを20秒間付与する。後からの一時Shield付与は残存量へ加算せず値と期限を上書きする。"
#   fallback: "対象不在時もShield消費は行い、発動者の位置へホーリースマイトと同じ聖柱を20秒間表示する。聖柱は毎秒、球形半径15mの敵最大1体へ近接攻撃力50%の無属性ダメージを与える。"
