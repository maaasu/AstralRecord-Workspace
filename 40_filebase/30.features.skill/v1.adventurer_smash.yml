# design:
#   motif: "打撃 / 落下"
#   progression: 1
schemaVersion: 1
id: adventurer_smash
type: SKILL
implementationId: adventurer_smash
name: "&bスマッシュ"
description: "&7敵を叩き伏せる重撃。"
icon: IRON_AXE
lore:
  - "&7プレイヤーの半径{skill.primaryRadius}m以内の敵1体へ近接攻撃力{skill.effectiveDamageRatio:percent}%の落下打撃。"
  - "&7複数の敵がいる場合は視点ライン上の敵を優先し、該当しなければ最も近い敵を選択。"
  - "&7着地点の半径{skill.impactRadius}m以内にいる別の敵へ近接攻撃力{skill.secondaryRatio:percent}%のダメージとノックバック。"
cooldownTicks: 150
resourceType: ENERGY
resourceCost: 30
castTimeTicks: 12
requiredLevel: 1
maxLevel: 5
levels:
  - level: 2
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
  - level: 3
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
  - level: 4
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
  - level: 5
    statusModifiers: [{ status: SKILL_DAMAGE_INCREASE, value: 5 }]
sigilSlotsByLevel:
  - { level: 1, slots: 1 }
  - { level: 3, slots: 2 }
  - { level: 5, slots: 3 }
allowedSigilIds:
  - cooldown_sigil
  - cooldown_sigil_ii
learnRequiredItems: [{ itemId: skill_gem_raw, amount: 1 }]
levelUpRequiredItems: [{ itemId: skill_gem_raw, amount: 1 }]
onCast:
  sound: entity.player.attack.strong
tags:
  - active
  - melee
  - adventurer
# behavior:
#   primaryTarget: "プレイヤーを中心とする primaryRadius の範囲から、視点方向の角度制限なしで対象を1体だけ選択する。複数候補では視点ラインと当たり判定が交差する対象を優先し、該当しなければ範囲内で最も近い対象を選ぶ。対象の着地点へ上空から落下させ、追加の打ち上げ・スタンは発生させない。"
#   secondaryTargets: "着地点を中心とする impactRadius の範囲から主対象を除いて最大 maxSecondaryTargets 体を選び、近接攻撃力へ secondaryRatio を掛けたダメージを与える。副対象がいない場合は主対象だけに命中する。"
#   secondaryKnockback: "副対象へ着地点から外向きのノックバックを secondaryKnockback 倍で与え、KNOCKBACK_RESISTANCE の通常補正を適用する。ダメージが成立しなかった副対象にはノックバックしない。"
#   timing: "発動時に castTimeTicks の詠唱を行い、対象選択後 impactDelayTicks tick 後に主対象・副対象への命中処理を実行する。"
#   balance: "副対象ダメージは単体高火力の DPS へ加算せず、複数対象時の付加価値として扱う。主対象の倍率・クールダウン・コストは対象数で変化しない。"
# visuals:
#   cast: "主対象の右上から着地点へ向かう斜めの CRIT 軌跡と ELECTRIC_SPARK の副軌跡を表示する。"
#   impact: "着地点の地面ブロックを使ったブロック粉塵を表示し、SWEEP_ATTACK と ELECTRIC_SPARK のリングを6 tickかけて半径0から impactRadius まで拡大する。"
params:
  primaryRadius: 4.0
  impactRadius: 2.0
  damageRatio: 3.60
  secondaryRatio: 0.576
  secondaryKnockback: 1.0
  impactDelayTicks: 8
  maxSecondaryTargets: 8
