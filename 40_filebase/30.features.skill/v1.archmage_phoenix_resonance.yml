name: "&6不死鳥との共鳴"
description: "&7不死鳥と共鳴し、戦いをともにする。"
icon: PARROT_SPAWN_EGG
lore:
  - "&7敵モブとの戦闘が始まると、不死鳥が背後の空を追従する。"
  - "&7不死鳥のHPを表すphoenixを獲得する。最大値は{skill.phoenixMax}。"
  - "&7召喚時のphoenixは{skill.phoenixMax}になる。"
  - "&7最後に攻撃した敵が{skill.targetRange}m以内からいなくなって{skill.despawnDelayTicks:seconds}秒後に消滅する。"
  - "&7召喚中は敵への命中ごとに対象と消滅までの待機時間を更新する。"
  - "&7自身の最後の通常攻撃先、次に自身の魔法陣の影響中の仲間が攻撃した敵を狙う。"
  - "&7追加攻撃がない場合、不死鳥は9.5秒ごとに炎属性魔法攻撃力30%で攻撃する。"
  - "&7不死鳥の通常攻撃速度は攻撃速度の影響を受けない。"
  - "&7不死鳥の追加攻撃回数1回ごとに、帰還前の攻撃を1回追加する。"
  - "&7追加攻撃の終了後から、次の通常攻撃の命中まで9.5秒となる。"
  - "&7攻撃時にMP20とphoenix20を消費する。"
  - "&7命中時、{skill.burningChance}%で3秒間の燃焼を付与する。"
  - "&7phoenixが0になると卵になり、30秒後に孵化して最大Lvのメテオを落とす。"
  - "&7不死鳥の召喚中は自身によるHP回復量が半減する。"
