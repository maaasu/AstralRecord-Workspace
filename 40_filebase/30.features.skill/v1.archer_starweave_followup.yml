  - "&6【制限】 &f強化条件は重複せず、追矢から霊印や継承を発生させない。"
  - "&6【制限】 &f追矢の発生は{skill.cooldownTicks:seconds}秒に1回。追加のMP・ENG消費はない。"
  - "&6【制限】 &f持ち替え・スキルブックの解除・死亡・転職で飛翔中の追矢は消える。"
