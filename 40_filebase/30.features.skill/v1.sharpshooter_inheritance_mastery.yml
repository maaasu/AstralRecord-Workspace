  - "&7通常攻撃1回ごとに、使用した各継承バフの残り時間を1回分消費する。"
  - "&7同名の継承バフを再付与すると、残り時間を新しい付与時間へ戻す。"
  - "&7追加リソース消費は継承バフ別の定義に従い、未定義なら消費しない。"
