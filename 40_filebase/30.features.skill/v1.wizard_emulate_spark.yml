  - "&7雷弾は{skill.durationTicks:seconds}秒間残り、敵に当たると消滅する。"
  - "&7各弾の直撃は魔法攻撃力{skill.effectiveDamageRatio:percent}%の雷属性ダメージ。"
  - "&7複数弾が同じ敵へ命中でき、各弾が{skill.shockChance}%で{skill.shockDurationTicks:seconds}秒感電させる。"
