name: "&bスペクトラルオーラリー"
description: "&8【概要】 &7三属性の魔法を重ね、天球儀の追撃を導く。"
icon: WHITE_STAINED_GLASS
lore:
  - "&6【条件】 &fスキルブックの装備とパッシブのバインドが必要。"
  - "&6【条件】 &f{skill.range}m以内の敵への&b火・氷・雷属性&fの魔法命中を重ねる。"
  - "&6【条件】 &f最初の命中から{skill.chainWindowTicks:seconds}秒以内に三属性が揃うと追撃する。"
  - "&b【攻撃】 &f最後の命中地点へ、&b火・氷・雷属性&fそれぞれ&b魔法攻撃力&f{skill.damageRatio:percent}%の追撃。"
  - "&b【範囲】 &f半径{skill.radius}m以内の敵、最大{skill.maxTargets}体が対象。"
  - "&6【条件】 &f追撃時にMPを消費し、{skill.cooldownTicks:seconds}秒間は連携できない。"
  - "&6【制限】 &fMP不足か対象がいない場合は追撃せず、集めた属性を失う。"
  - "&6【制限】 &f同じ属性の連打では期限を延長しない。複数属性の一撃はまとめて数える。"
  - "&6【制限】 &f回避・完全防御・持続ダメージ・スキルブックの追撃では連携しない。"
  - "&6【制限】 &f装備・バインド解除、死亡、ワールド移動で途中の連携を失う。"
