#   visual: "移動後の聖柱を中心に、半径12mの黄色い円形輪郭を4tick間隔で表示する。"
params:
  hpCost: 200.0
  pillarSearchRadius: 20.0
  effectRadius: 12.0
  partyDamageIncrease: 5.0
  mobDamageTakenIncrease: 5.0
  hpRecovery: 87.0
  mpRecoveryMaxManaRatio: 0.10
  relocatedPillarDurationTicks: 200
