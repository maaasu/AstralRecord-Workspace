# design:
#   motif: "聖柱の掌握 / 支援の祭壇"
#   progression: 2
schemaVersion: 1
id: paladin_holy_control
type: SKILL
implementationId: paladin_holy_control
name: "&fホーリーコントロール"
description: "&7最寄りの聖柱を操り、味方を支援する。"
icon: COMPARATOR
lore:
  - "&7HPを{skill.hpCost}消費して、半径{skill.pillarSearchRadius}m以内の最寄りの聖柱を自身へ移動する。"
  - "&7移動前の聖柱を削除し、移動後の持続時間を{skill.relocatedPillarDurationTicks:seconds}秒へ戻す。"
  - "&7聖柱がある間、半径{skill.effectRadius}m以内のパーティーメンバーのスキル与ダメージを{skill.partyDamageIncrease}%増加する。"
  - "&7同範囲の敵Mobの被ダメージを{skill.mobDamageTakenIncrease}%増加する。"
  - "&7毎秒、範囲内のパーティーメンバーをHP{skill.hpRecovery}、発動者の最大MPの{skill.mpRecoveryMaxManaRatio:percent}%回復する。"
cooldownTicks: 100
resourceType: MANA
resourceCost: 30
castTimeTicks: 5
requiredLevel: 1
maxLevel: 1
learnRequiredItems: [{ itemId: 10a00025, amount: 5 }]
levelUpRequiredItems: [{ itemId: 10a00025, amount: 5 }]
onCast:
  sound: block.beacon.activate
tags:
  - active
  - support
  - holy_knight
# behavior:
