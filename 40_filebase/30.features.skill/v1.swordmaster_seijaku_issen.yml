name: "&b静寂一閃"
description: "&7剣の構えから攻撃を受け流し、鋭く反撃する。"
icon: DIAMOND_SWORD
lore:
  - "&7Shiftを押した剣の通常攻撃を{skill.counterTicks}tickのカウンター構えに変える。"
  - "&7構え中の移動速度は70%低下し、残り時間をアクションバーへ表示する。"
  - "&7ダメージが0の直接攻撃も無効化し、攻撃者へ近接無属性{skill.counterDamageRatio:percent}%で反撃する。"
  - "&7続けて前方{skill.counterSweepRange}m・最大{skill.counterSweepMaxTargets}体へ同倍率で横薙ぎする。"
  - "&7最初の反撃が命中した場合だけ最大ENGの10%を回復する。"
  - "&7反撃・時間切れ時から剣通常攻撃のクールタイムを開始する。"
  - "&7Shiftを押さずに攻撃すると構えを解き、同じ入力で通常攻撃する。"
  - "&7時間切れ時はその場で構えを解き、突進やENG消費は発生しない。"
  - "&7反撃成立後{skill.riposteWindowTicks:seconds}秒間、連携技を一度だけ強化する剣気を得る。"
  - "&7剣気は返し刃・明鏡止水・リヴェンジアクセルで共有する。"
