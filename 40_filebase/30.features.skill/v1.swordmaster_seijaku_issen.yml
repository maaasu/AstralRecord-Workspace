name: "&b静寂一閃"
description: "&7剣の構えから攻撃を受け流し、鋭く反撃する。"
icon: DIAMOND_SWORD
lore:
  - "&7剣の通常攻撃を{skill.counterTicks}tickのカウンター構えに変える。"
  - "&7構え中の移動速度は70%低下し、残り時間をアクションバーへ表示する。"
  - "&7ダメージが0の直接攻撃も無効化し、攻撃者へ近接無属性{skill.counterDamageRatio:percent}%で反撃する。"
  - "&7続けて前方{skill.counterSweepRange}m・最大{skill.counterSweepMaxTargets}体へ同倍率で横薙ぎする。"
  - "&7最初の反撃が命中した場合だけ最大ENGの10%を回復する。"
  - "&7構え解除時から剣通常攻撃のクールタイムを開始する。"
  - "&7時間切れ時はENG10を消費し、前方約10mの経路上の敵を近接無属性{skill.failureDamageRatio:percent}%で攻撃する。"
  - "&7タックル中の被ダメージを{skill.tackleDamageReductionRatio:percent}%軽減する。"
  - "&7タックル命中時は半径{skill.explosionRadius}mの各敵へ近接無属性{skill.explosionDamageRatio:percent}%の爆発を追加する。"
  - "&7タックル命中時の通常攻撃クールタイムは{skill.tackleHitCooldownMultiplier}倍となる。"
