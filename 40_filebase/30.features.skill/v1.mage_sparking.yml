  - magic
  - lightning
# behavior:
#   projectile: "足元付近から水平360度へ等間隔に雷弾を放つ。各弾は速度0.65m/tick・命中半径0.45mで50tick進み、Block面の法線で反射する。"
#   hit: "管理対象Mobだけを対象にMAGIC/LIGHTNINGの100%を適用し、25%でSHOCKEDを100tick付与する。同一発動では対象ごとに1回だけ命中する。"
#   lifecycle: "雷弾はMob命中時に消滅し、Block反射または寿命まで残る。PvP、NPC、別world、死亡Mobは対象外。"
