# design:
#   motif: "Path of Exile 2 / Spark"
#   progression: 2
schemaVersion: 1
id: mage_sparking
type: SKILL
implementationId: mage_sparking
name: "&eスパーキング"
description: "&7雷の渦を周囲へ広げる雷属性魔法。"
icon: GLOWSTONE_DUST
lore:
  - "&7周囲へ{skill.projectileCount}個の雷弾を放ち、触れた敵へ魔法攻撃力{skill.effectiveDamageRatio:percent}%の雷属性ダメージ。"
  - "&7同じ発動では敵1体につき1回だけ命中し、{skill.shockChance}%の確率で{skill.shockDurationTicks:seconds}秒感電させる。"
  - "&7雷弾は外へ広がる渦を描き、壁で反射して{skill.durationTicks:seconds}秒後に消滅する。"
cooldownTicks: 160
resourceType: MANA
resourceCost: 18
castTimeTicks: 4
requiredLevel: 1
maxLevel: 5
levels:
  - level: 2
    paramDeltas: { projectileCount: 2 }
  - level: 3
    paramDeltas: { projectileCount: 2 }
  - level: 4
    paramDeltas: { projectileCount: 2 }
  - level: 5
    paramDeltas: { projectileCount: 2 }
sigilSlotsByLevel:
  - { level: 1, slots: 1 }
  - { level: 3, slots: 2 }
  - { level: 5, slots: 3 }
allowedSigilIds:
  - cooldown_sigil
  - cooldown_sigil_ii
learnRequiredItems: [{ itemId: skill_gem_raw, amount: 3 }]
levelUpRequiredItems: [{ itemId: skill_gem_raw, amount: 3 }]
onCast:
  sound: entity.lightning_bolt.thunder
tags:
  - active
  - magic
  - lightning
# behavior:
#   projectile: "足元付近から水平360度へ等間隔に雷弾を放つ。各弾は半径を0.10m/tick、角度を14.4度/tick増やして50tickで半径5m・2周の渦を描き、命中半径0.60mでBlock面の法線に沿って軌道ごと反射する。"
#   hit: "管理対象Mobだけを対象にMAGIC/LIGHTNINGの120%を適用し、25%でSHOCKEDを100tick付与する。同一発動では対象ごとに1回だけ命中する。"
#   lifecycle: "雷弾はMob命中時に消滅し、Block反射または寿命まで残る。PvP、NPC、別world、死亡Mobは対象外。"
params:
  damageRatio: 1.2
  projectileCount: 5
  spiralRadiusGrowth: 0.10
  spiralDegreesPerTick: 14.4
  projectileHitRadius: 0.60
  durationTicks: 50
  shockChance: 25.0
  shockDurationTicks: 100
