schemaVersion: 1

database:
  - name: item #カテゴリごとにサブディレクトリが作成されていることを前提とする。
    path: 10.features.item
  - name: enchant
    path: 12.features.enchant
  - name: class
    path: 20.features.class
  - name: skill
    path: 30.features.skill
  - name: mob
    path: 40.features.mob
  - name: mob_spawner
    path: 41.features.mob.spawner
  - name: gathering
    path: 42.features.gathering
  - name: gathering_spawner
    path: 43.features.gathering.spawner
  - name: world
    path: 60.features.world
  - name: dungeon
    path: 65.features.dungeon
  - name: mail
    path: 05.features.mail
  - name: guide
    path: 09.features.guide
  - name: shop
    path: 45.features.shop

  - name: set_effect
    path: 10.features.item/equipment/set_effect

  - name: buff
    path: 70.shared.buff
  - name: loot #サブディレクトリとして、pool, tableが作成されていることを前提とする。
