    database: loot.pool
    aliases: ["lp"]
  - prefix: "buff:"
    database: buff
    aliases: ["bf"]
  - prefix: "class:"
    database: class
    aliases: ["cs"]
  - prefix: "skill:"
    database: skill
    aliases: ["sk"]
  - prefix: "set:"
    database: set_effect
    aliases: ["st"]
  - prefix: "recipe:"
    database: recipe
    aliases: ["rc"]
  - prefix: "shop:"
    database: shop
    aliases: ["sh"]
  - prefix: "mob:"
    database: mob
    aliases: ["mb"]
  - prefix: "mob_spawner:"
    database: mob_spawner
    aliases: ["ms"]
  - prefix: "gathering:"
    database: gathering
    aliases: ["gt"]
  - prefix: "gathering_spawner:"
    database: gathering_spawner
    aliases: ["gs"]
  - prefix: "world:"
    database: world
    aliases: ["wd"]
  - prefix: "dungeon:"
    database: dungeon
    aliases: ["dn"]
  - prefix: "mail:"
    database: mail
    aliases: ["ml"]
  - prefix: "guide:"
