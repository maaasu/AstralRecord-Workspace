# design:
#   motif: "進行設計 / 冒険の始まり"
#   progression: 0
schemaVersion: 1
type: GAME_FLOW
id: beginner_onboarding_chapter_1
name: "第1章 グラスボアを1体倒そう"
description: "矢印はガイドの案内順。6手順は順不同で達成でき、ガイドは最初の未達成手順を案内する。"
nodes:
  - id: open_menu
    role: action
    label: "メニューを開く"
    note: "案内具を使ってメインメニューを開く。"
    x: 0
    y: 0
  - id: receive_welcome_mail
    ref: mail:welcome_mail
    label: "贈り物を受け取る"
    note: "初ログイン記念メールの贈り物を受け取る。受取済み・対象外の場合は達成が補完される。"
    x: 232
    y: 0
  - id: open_initial_bundle
    ref: item:50a00001
    label: "バンドルを開ける"
    note: "初ログインバンドルをホットバーに入れて手に持ち、「使う」操作で開封する。初回メールが受取済み・対象外で、未開封のバンドルが手持ちや倉庫にない場合は達成が補完される。"
    x: 464
    y: 0
  - id: find_general_goods_merchant
    ref: mob:general_goods_merchant
    label: "雑貨商ミナ（NPC）"
    note: "ガイドの購入手順から場所を表示できる。右クリックで雑貨店を開く。"
    x: 696
    y: 0
  - id: buy_starter_weapon
    ref: shop:general_goods_shop
    label: "雑貨店で武器を買う"
    note: "簡素な武器を購入する。達成を記録する商品のIDは nox_weapon。"
    x: 696
    y: 172
  - id: equip_starter_weapon
    ref: item:20a00001
    label: "武器を主手に装備"
    note: "装備画面でバッグの簡素な武器を選び、主手に装備する。"
    x: 464
    y: 172
  - id: defeat_grassboar
    ref: mob:midgard_grassboar
    label: "グラスボアを1体倒す"
    note: "案内先はミズガルズの緑野。対象IDの討伐で達成する。"
    x: 232
    y: 172
  - id: chapter_clear
    ref: guide:beginner_onboarding
    label: "第1章クリア"
    note: "6手順をすべて達成するとクリア。"
    x: 0
    y: 172
  - id: claim_chapter_reward
    role: action
    label: "宝箱から報酬を請求"
    note: "ガイド一覧・詳細の宝箱を選ぶと報酬メールが発行される。"
    x: 0
    y: 344
  - id: receive_chapter_reward
    role: action
    label: "添付報酬を受け取る"
    note: "請求後に発行されるメール「第1章 達成報酬」を開く。"
    x: 232
    y: 344
  - id: reward_conditions
    label: "報酬の請求は1回限り"
    note: "全ガイド（現行は第1章のみ）の全手順が達成済みとして保存され、有効な報酬設定がある場合、アカウントにつき一度だけ請求できる。"
    x: 464
    y: 344
  - id: guide_order
    label: "6手順の達成は順不同"
    note: "矢印はガイドの案内順。ガイドは最初の未達成手順を案内する。雑貨商ミナは購入の入口で、独立した達成手順には含まれない。"
    x: 696
    y: 344
edges:
  - from: open_menu
    to: receive_welcome_mail
    fromPort: right
    toPort: left
  - from: receive_welcome_mail
    to: open_initial_bundle
    fromPort: right
    toPort: left
  - from: open_initial_bundle
    to: find_general_goods_merchant
    fromPort: right
    toPort: left
  - from: find_general_goods_merchant
    to: buy_starter_weapon
    fromPort: bottom
    toPort: top
    label: "店を開く"
  - from: buy_starter_weapon
    to: equip_starter_weapon
    fromPort: left
    toPort: right
  - from: equip_starter_weapon
    to: defeat_grassboar
    fromPort: left
    toPort: right
  - from: defeat_grassboar
    to: chapter_clear
    fromPort: left
    toPort: right
  - from: chapter_clear
    to: claim_chapter_reward
    fromPort: bottom
    toPort: top
    label: "受取可能"
  - from: claim_chapter_reward
    to: receive_chapter_reward
    fromPort: right
    toPort: left
