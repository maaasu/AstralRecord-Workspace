  - "&7影輪の天球儀の中心で脈打つ、星蝕の心臓。"
  - "&7エリヴァ超大陸の受付でスニークして挑戦。1～6人に対応。"
  - "&7床の環と放射線、四本の遮蔽柱、八枚の封印板が攻略の手掛かり。"
  - "&7赤い環の帯から逃れ、守護像の光条と心拍の二拍を見切ろう。"
  - "&7星印は場の外周で解き放ち、残る星痕を中央に残さないこと。"
  - "&7残り七割から蝕光の視線と星墜が加わる。視線は遮蔽柱の影で防げる。"
  - "&7残り七割・四割で封印調律。光る封印板に立って天球を開き、露出時に攻撃しよう。"
  - "&7残り四割からは環影と光条が重なる。安全な帯の隙間を探せ。"
