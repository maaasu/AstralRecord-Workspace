  - "&7時計盤の侵入者を針で狙い、足跡を過去へ刻む機工王。"
  - "&7拠点で /boss horologium から挑戦。1～6人に対応。"
  - "&7針の線から離れ、足跡が固定されたら4ブロック以上移動しよう。"
  - "&7外壁の方位札で北・東・南・西を確認し、針の角度を読もう。"
  - "&7反響が終わると六秒間、攻撃が通りやすくなる。"
  - "&7標的が示された歯車印の塗り床に足跡を残して離れると、九秒の強い反撃機会を得る。"
  - "&7残り七割から針が時計回りに90度回転。赤い最終線で衝突する。"
  - "&7残り三割五分から最終線のあと初期線を逆再演。巻戻しの予告を読もう。"
  - "&7素材抽選100%。受取には同会場参加・非AFK・BAG容量が必要。"
