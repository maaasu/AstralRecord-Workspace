# design:
#   motif: "星影の街ノクス / 冒険の始まり"
#   progression: 0
schemaVersion: 3
id: beginner_onboarding
category: beginner
displayOrder: 10
title: "グラスボアを1体倒そう"
iconMaterial: NETHER_STAR
summary: "&7武器を用意して、ミズガルズの緑野でグラスボアを1体倒す。"
steps:
  - id: open_menu
    text: "&fメインメニューを開く"
    details:
      - "&7案内具を使ってメインメニューを開く。"
    condition:
      type: MAIN_MENU_OPENED
  - id: receive_welcome_mail
    text: "&fメールの贈り物を受け取る"
    details:
      - "&7メールを開き、&e初ログイン記念の贈り物&7を選んで受け取る。"
    action:
      type: OPEN_MENU
      menuId: mail
      description: "&dクリックでメールを開く。"
    condition:
      type: MAIL_RECEIVED
      targetId: welcome_mail
  - id: open_initial_bundle
    text: "&e初ログインバンドル&fを開封する"
    details:
      - "&7持ち物の&e初ログインバンドル&7を選び、ホットバーに割り当てる。"
      - "&7その枠を手に持ち、画面を閉じて「使う」操作（Java版は右クリック）で開封する。"
    condition:
      type: BUNDLE_OPENED
      targetId: 50a00001
  - id: buy_starter_weapon
    text: "&e簡素な武器&fを購入する"
    details:
      - "&7雑貨商ミナに会い、店で&e簡素な武器&7を購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商ミナの場所を表示する。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_weapon
  - id: equip_starter_weapon
    text: "&e簡素な武器&fを装備する"
    details:
      - "&7装備画面でバッグの&e簡素な武器&7を選び、主手に装備する。"
    action:
      type: OPEN_MENU
      menuId: equipment
      description: "&dクリックで装備画面を開く。"
    condition:
      type: ITEM_EQUIPPED
      targetId: 20a00001
  - id: defeat_grassboar
    text: "&eグラスボア&fを1体倒す"
    details:
      - "&7ミズガルズの緑野で&eグラスボア&7を1体倒す。"
    condition:
      type: MOB_DEFEATED
      targetId: midgard_grassboar
