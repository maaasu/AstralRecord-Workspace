# design:
#   motif: "星影の街ノクス / 冒険の始まり"
#   progression: 0
schemaVersion: 3
id: beginner_onboarding
category: beginner
displayOrder: 10
title: "&b冒険を始めよう"
iconMaterial: NETHER_STAR
summary: "&7ノクスで必要な準備、最初の戦闘、採集を体験する。"
steps:
  - id: login
    text: "&fゲームへログインする"
    details:
      - "&7サーバーへ接続し、プレイヤーデータの読み込みが完了するまで待つ。"
      - "&7これを見れているということはすでに達成済みですね！おめでとうございます。"
    condition:
      type: PLAYER_LOGGED_IN
  - id: claim_login_bonus
    text: "&fログインボーナスを受け取る"
    details:
      - "&7ログインボーナス案内人に話しかける。"
      - "&7開いたログインボーナスGUIで、本日の日付の報酬をクリックする。"
    action:
      type: NAVIGATE_NPC
      npcId: login_bonus_clerk
      description: "&dクリックでログインボーナス案内人の場所を表示します。"
    condition:
      type: LOGIN_BONUS_CLAIMED
  - id: receive_welcome_mail
    text: "&fメールから&e初ログイン記念の贈り物&fを受け取る"
    details:
      - "&7メールGUIを開き、&e初ログイン記念の贈り物&7をクリックして受け取る。"
    action:
      type: OPEN_MENU
      menuId: mail
      description: "&dクリックでメールGUIを開く。"
    condition:
      type: MAIL_RECEIVED
      targetId: welcome_mail
  - id: open_initial_bundle
    text: "&e初ログインバンドル&fを開封する"
    details:
      - "&7メールの報酬から&e初ログインバンドル&7を受け取る。"
      - "&7インベントリで&e初ログインバンドル&7をクリックして開封する。"
    condition:
      type: BUNDLE_OPENED
      targetId: initial_login_bundle
  - id: buy_starter_weapon
    text: "&f雑貨商で&e簡素な武器&fを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで&e簡素な武器&7を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_weapon
  - id: buy_starter_armor_helmet
    text: "&f雑貨商で&eノクスヘルム&fを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで&eノクスヘルム&7を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_helmet
  - id: buy_starter_armor_chest
    text: "&f雑貨商で&eノクスメイル&fを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで&eノクスメイル&7を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_chest
  - id: buy_starter_armor_legs
    text: "&f雑貨商で&eノクスグリーブ&fを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで&eノクスグリーブ&7を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_legs
  - id: buy_starter_armor_boots
    text: "&f雑貨商で&eノクスブーツ&fを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで&eノクスブーツ&7を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_boots
  - id: unlock_free_node
    text: "&fスキルツリーの&e無料ルートノード&fを解放する"
    details:
      - "&7スキルツリーへ移動し、&e無料表示のルートノード&7をクリックする。"
      - "&7確認画面でノードの解放を確定する。"
    action:
      type: NAVIGATE_NPC
      npcId: skilltree_entry_guide
      description: "&dクリックでスキルツリー案内人の場所を表示し、発光させる。"
    condition:
      type: SKILLTREE_NODE_UNLOCKED
      targetId: "1047"
  - id: buy_astral_edge
    text: "&fスキルジェム交換で&eアストラルエッジ&fを購入する"
    details:
      - "&7星晶錬成師に話しかけ、スキルジェム交換GUIを開く。"
      - "&7&eアストラルエッジ&7を選択し、必要な&e原石&7を消費して購入する。"
      - "&a購入すると、&eアストラルエッジ&aを自動的に習得できる。"
    action:
      type: NAVIGATE_NPC
      npcId: skill_gem_alchemist
      description: "&dクリックで星晶錬成師の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: astral_edge_from_raw
  - id: buy_smash
    text: "&fスキルジェム交換で&eスマッシュ&fを購入する"
    details:
      - "&7星晶錬成師に話しかけ、スキルジェム交換GUIを開く。"
      - "&7&eスマッシュ&7を選択し、必要な&e原石&7を消費して購入する。"
      - "&a購入すると、&eスマッシュ&aを自動的に習得できる。"
    action:
      type: NAVIGATE_NPC
      npcId: skill_gem_alchemist
      description: "&dクリックで星晶錬成師の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: smash_from_raw
  - id: enhance_skill
    text: "&f同じスキルジェムを再購入して強化する"
    details:
      - "&7星晶錬成師のスキルジェム交換GUIで、習得済みスキルのジェムを選択する。"
      - "&7次の購入で上がるレベルを確認し、同じジェムをもう一度購入する。"
      - "&a再購入するとスキルジェムが即時消費され、対象スキルのレベルが1上がる。"
    condition:
      type: SKILL_ENHANCED
      targetIds:
        - adventurer_astral_edge
        - adventurer_smash
  - id: bind_skill_to_action_ring
    text: "&f習得したスキルをアクションリングに設定する"
    details:
      - "&7スキルマネージャーGUIを開き、習得したスキルを左クリックする。"
      - "&7アクションリングスロットに習得したスキルが設定されたことを確認する。"
    action:
      type: OPEN_MENU
      menuId: skill_bind
      description: "&dクリックでスキルマネージャーGUIを開く。"
    condition:
      type: SKILL_BOUND
      targetIds:
        - adventurer_astral_edge
        - adventurer_smash
  - id: cast_astral_edge
    text: "&f&eアストラルエッジ&fを発動する"
    details:
      - "&7アクションリングを&e武器を持って右クリック&7で開き、&eアストラルエッジ&7を選択する。"
      - "&7選択したスキルの発動操作を行う。"
    condition:
      type: SKILL_CAST
      targetId: adventurer_astral_edge
  - id: defeat_grassboar
    text: "&f&eグラスボア&fを討伐する"
    details:
      - "&7&eアストラルエッジ&7などのスキルを使い、&eグラスボア&7のHPを0にする。"
    condition:
      type: MOB_DEFEATED
      targetId: midgard_grassboar
  - id: buy_hoe
    text: "&f雑貨商で&eノクスクワ&fを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで&eノクスクワ&7を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_hoe
  - id: accept_gathering_quest
    text: "&f村長マルクスから&e採集依頼&fを受注する"
    details:
      - "&7村長マルクスに話しかけ、&eノクス草花の採集依頼&7を受注する。"
    action:
      type: NAVIGATE_NPC
      npcId: village_elder
      description: "&dクリックで村長マルクスの場所を表示し、発光させる。"
    condition:
      type: QUEST_ACCEPTED
      targetId: nox_flora_gathering
  - id: report_gathering_quest
    text: "&f採集依頼を達成して村長マルクスに報告する"
    details:
      - "&7ノクスの草地に出現する7種類の採集オブジェクトを、表示された必要数ずつ最後まで採集する。"
      - "&7目標をすべて達成したら、村長マルクスに話しかけて依頼を報告する。"
    action:
      type: NAVIGATE_NPC
      npcId: village_elder
      description: "&dクリックで村長マルクスの場所を表示し、発光させる。"
    condition:
      type: QUEST_COMPLETED
      targetId: nox_flora_gathering
