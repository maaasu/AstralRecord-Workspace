# design:
#   motif: "星影の街ノクス / 冒険の始まり"
#   progression: 0
schemaVersion: 3
id: beginner_onboarding
category: beginner
displayOrder: 10
title: "&b冒険を始めよう"
iconMaterial: NETHER_STAR
summary: "&7ノクスで必要な準備と最初の戦闘を体験する。"
steps:
  - id: login
    text: "&fゲームへログインする"
    details:
      - "&7サーバーへ接続し、プレイヤーデータの読み込みが完了するまで待つ。"
    condition:
      type: PLAYER_LOGGED_IN
  - id: claim_login_bonus
    text: "&fログインボーナスを受け取る"
    details:
      - "&7ログインボーナス案内人に話しかける。"
      - "&7開いたログインボーナスGUIで、本日の日付の報酬をクリックする。"
    action:
      type: NAVIGATE_NPC
      npcId: login_bonus_clerk
      description: "&7クリックでログインボーナス案内人の場所を表示し、発光させる。"
    condition:
      type: LOGIN_BONUS_CLAIMED
  - id: receive_welcome_mail
    text: "&fメールから初ログイン記念の贈り物を受け取る"
    details:
      - "&7メールGUIを開く。"
      - "&7初ログイン記念の贈り物をクリックして受け取る。"
    action:
      type: OPEN_MENU
      menuId: mail
      description: "&7クリックでメールGUIを開く。"
    condition:
      type: MAIL_RECEIVED
      targetId: welcome_mail
  - id: open_initial_bundle
    text: "&f初ログインバンドルを開封する"
    details:
      - "&7メールの報酬から初ログインバンドルを受け取る。"
      - "&7インベントリで初ログインバンドルをクリックして開封する。"
    condition:
      type: BUNDLE_OPENED
      targetId: initial_login_bundle
  - id: buy_starter_weapon
    text: "&f雑貨商で簡素な武器を購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIで簡素な武器を選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&7クリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_weapon
  - id: buy_starter_armor_helmet
    text: "&f雑貨商でノクスヘルムを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIでノクスヘルムを選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&7クリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_helmet
  - id: buy_starter_armor_chest
    text: "&f雑貨商でノクスメイルを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIでノクスメイルを選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&7クリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_chest
  - id: buy_starter_armor_legs
    text: "&f雑貨商でノクスグリーブを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIでノクスグリーブを選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&7クリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_legs
  - id: buy_starter_armor_boots
    text: "&f雑貨商でノクスブーツを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIでノクスブーツを選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&7クリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_boots
  - id: unlock_free_node
    text: "&fスキルツリーの無料ルートノードを解放する"
    details:
      - "&7スキルツリーへ移動し、無料表示のルートノードをクリックする。"
      - "&7確認画面でノードの解放を確定する。"
    action:
      type: NAVIGATE_NPC
      npcId: skilltree_entry_guide
      description: "&7クリックでスキルツリー案内人の場所を表示し、発光させる。"
    condition:
      type: SKILLTREE_NODE_UNLOCKED
      targetId: "1047"
  - id: buy_astral_edge
    text: "&fスキルジェム交換でアストラルエッジを入手する"
    details:
      - "&7星晶錬成師に話しかけ、スキルジェム交換GUIを開く。"
      - "&7アストラルエッジを選択し、必要な原石を消費して交換する。"
    action:
      type: NAVIGATE_NPC
      npcId: skill_gem_alchemist
      description: "&7クリックで星晶錬成師の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: astral_edge_from_raw
  - id: buy_smash
    text: "&fスキルジェム交換でスマッシュを入手する"
    details:
      - "&7星晶錬成師に話しかけ、スキルジェム交換GUIを開く。"
      - "&7スマッシュを選択し、必要な原石を消費して交換する。"
    action:
      type: NAVIGATE_NPC
      npcId: skill_gem_alchemist
      description: "&7クリックで星晶錬成師の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: smash_from_raw
  - id: enhance_skill
    text: "&fスキルを合成して強化する"
    details:
      - "&7所持しているスキルジェムを使い、強化対象のスキルを選択する。"
      - "&7必要な素材を確認し、合成を確定する。"
    condition:
      type: SKILL_ENHANCED
  - id: cast_astral_edge
    text: "&fアストラルエッジを発動する"
    details:
      - "&7アクションリングを開き、アストラルエッジを選択する。"
      - "&7選択したスキルの発動操作を行う。"
    condition:
      type: SKILL_CAST
      targetId: adventurer_astral_edge
  - id: defeat_grassboar
    text: "&fグラスボアを討伐する"
    details:
      - "&7アストラルエッジなどのスキルを使い、グラスボアのHPを0にする。"
    condition:
      type: MOB_DEFEATED
      targetId: midgard_grassboar
  - id: buy_hoe
    text: "&f雑貨商でノクスクワを購入する"
    details:
      - "&7雑貨商に話しかけ、ショップGUIでノクスクワを選択して購入する。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&7クリックで雑貨商の場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_hoe
