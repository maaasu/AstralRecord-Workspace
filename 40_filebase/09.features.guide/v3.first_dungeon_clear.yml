steps:
  - id: clear_middle_earth_ruins
    text: "&eミドルアースの遺跡&fを攻略する"
    details:
      - "&7推奨レベルは5。一人またはパーティーで受付ゲートから挑戦する。"
      - "&7制限時間は10分。道中の部屋で敵をすべて倒し、開いたゲートの先へ進む。"
      - "&7ダンジョン内では5回まで死亡しても復帰できる。6回目の死亡で挑戦失敗になる。"
      - "&a最後にボスを倒すとダンジョンをクリアし、宝箱が出現する。"
      - "&730秒以内に宝箱からクリア報酬を受け取る。"
    condition:
      type: DUNGEON_CLEARED
      targetId: middle_earth_ruins
  - id: farm_gold_and_buy_cartograph
    text: "&fダンジョンを周回してお金を集め、{item:cartograph}&fを購入する"
    details:
      - "&7ダンジョンを周回してお金を集め、&e{item:cartograph}&7を購入できるようにする。"
      - "&7お金が貯まったら、雑貨商ミナから&e{item:cartograph}&7を購入しよう。"
      - "&aカルトグラフがあれば、攻略したダンジョンの情報を確認できる。"
    action:
      type: NAVIGATE_NPC
      npcId: general_goods_merchant
      description: "&dクリックで雑貨商ミナの場所を表示し、発光させる。"
    condition:
      type: SHOP_PURCHASED
      targetId: cartograph
