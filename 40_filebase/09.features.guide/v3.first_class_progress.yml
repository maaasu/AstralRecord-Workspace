      type: CLASS_CHANGED
      targetIds:
        - swordsman
        - hunter
        - mage
  - id: unlock_class_cp_node
    text: "&f職業のCPを使ってスキルツリーノードを解放する"
    details:
      - "&7職業レベルで得たCPを確認し、スキルツリー案内人に話しかける。"
      - "&7選んだ職業に対応するCPノードを選び、解放を確定する。"
    action:
      type: NAVIGATE_NPC
      npcId: skilltree_entry_guide
      description: "&dクリックでスキルツリー案内人の場所を表示する。"
    condition:
      type: SKILLTREE_CP_NODE_UNLOCKED
