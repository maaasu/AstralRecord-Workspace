schemaVersion: 3
id: first_class_progress
category: skill
displayOrder: 20
title: "&b職業を選んで育てよう"
iconMaterial: BOOK
summary: "&7職業を選び、その職業のCPでスキルツリーを進める。"
steps:
  - id: choose_first_class
    text: "&f職業案内人ミラに話しかけて職業を選ぶ"
    details:
      - "&7職業案内人ミラを右クリックし、職業選択画面を開く。"
      - "&7転職条件を確認し、進みたい職業を選んで確定する。"
    action:
      type: NAVIGATE_NPC
      npcId: class_guide
      description: "&dクリックで職業案内人ミラの場所を表示する。"
