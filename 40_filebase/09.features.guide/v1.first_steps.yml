summary: "&7初参加時に最初に確認する手順。"
lines:
  - "&fまずメニューを開き、&dガイド&fを確認してください。"
  - "&fウェルカムメールの100アストラルドを受け取ります。"
  - "&f武器・ツールショップで初期武器と必要な採集ツールを選び、防具屋で装備を整えます。"
  - "&f武器と防具を装備したら、{menu:skill_bind} でスキルを設定します。"
  - "&f準備ができたら拠点からオーバーワールドへ移動し、低レベルの敵で操作を確認します。"
