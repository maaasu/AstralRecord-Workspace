# design:
#   motif: "星影の街ノクス / 冒険の始まり"
#   progression: 0
schemaVersion: 2
id: beginner_onboarding
category: beginner
displayOrder: 10
title: "&b冒険を始めよう"
iconMaterial: NETHER_STAR
summary: "&7ノクスで必要な準備と最初の戦闘を順に体験します。"
steps:
  - id: login
    text: "&fログインして、ノクスでの冒険を始めます。"
    condition:
      type: PLAYER_LOGGED_IN
  - id: claim_login_bonus
    text: "&fログインボーナスを受け取ります。"
    condition:
      type: LOGIN_BONUS_CLAIMED
  - id: receive_welcome_mail
    text: "&fメールから初ログイン記念の贈り物を受け取ります。"
    condition:
      type: MAIL_RECEIVED
      targetId: welcome_mail
  - id: open_initial_bundle
    text: "&fインベントリの初ログインバンドルを開封します。"
    condition:
      type: BUNDLE_OPENED
      targetId: initial_login_bundle
  - id: buy_starter_weapon
    text: "&f雑貨商でノクスソードを購入します。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_sword
  - id: buy_starter_armor_helmet
    text: "&f雑貨商でノクスヘルムを購入します。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_helmet
  - id: buy_starter_armor_chest
    text: "&f雑貨商でノクスメイルを購入します。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_chest
  - id: buy_starter_armor_legs
    text: "&f雑貨商でノクスグリーブを購入します。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_legs
  - id: buy_starter_armor_boots
    text: "&f雑貨商でノクスブーツを購入します。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_armor_boots
  - id: unlock_free_node
    text: "&fスキルツリーの無料ルートノードを解放します。"
    condition:
      type: SKILLTREE_NODE_UNLOCKED
      targetId: "1047"
  - id: buy_astral_edge
    text: "&fスキルジェム交換でアストラルエッジを入手します。"
    condition:
      type: SHOP_PURCHASED
      targetId: astral_edge_from_raw
  - id: buy_smash
    text: "&fスキルジェム交換でスマッシュを入手します。"
    condition:
      type: SHOP_PURCHASED
      targetId: smash_from_raw
  - id: enhance_skill
    text: "&fスキルを合成して強化します。"
    condition:
      type: SKILL_ENHANCED
  - id: cast_astral_edge
    text: "&fアストラルエッジを発動します。"
    condition:
      type: SKILL_CAST
      targetId: adventurer_astral_edge
  - id: defeat_grassboar
    text: "&fグラスボアを討伐します。"
    condition:
      type: MOB_DEFEATED
      targetId: midgard_grassboar
  - id: buy_hoe
    text: "&f雑貨商でノクスクワを購入します。"
    condition:
      type: SHOP_PURCHASED
      targetId: nox_hoe
