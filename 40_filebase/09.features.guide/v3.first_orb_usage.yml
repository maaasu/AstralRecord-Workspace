# design:
#   motif: "オーブ / 初めての装備更新"
#   progression: 1
schemaVersion: 3
id: first_orb_usage
category: world
displayOrder: 10
title: "&dオーブを使おう"
iconMaterial: ENDER_PEARL
summary: "&7オーブで装備・ルーン・シジルを操作する方法を確認する。"
steps:
  - id: use_sindri_orb
    text: "&f{item:40a00011}&fで装備を修復する"
    details:
      - "&7インベントリで{item:40a00011}&7をクリックする。"
      - "&7一覧から修復したい装備を選択する。"
      - "&a使用すると、装備の耐久値が75回復する。"
    condition:
      type: ORB_USED
      targetId: 40a00011
  - id: use_tyr_orb
    text: "&f{item:40a00003}&fで武器を強化する"
    details:
      - "&7インベントリで{item:40a00003}&7をクリックする。"
      - "&7一覧から状態ランク0の武器を選択し、確認画面が表示された場合は実行を確定する。"
      - "&7強化の成功率と失敗時の挙動は武器ごとに異なる。"
      - "&a強化に成功すると、武器が1段階強化される。"
    condition:
      type: ORB_USED
      targetId: 40a00003
  - id: use_aegis_orb
    text: "&f{item:40a00001}&fで防具を強化する"
    details:
      - "&7インベントリで{item:40a00001}&7をクリックする。"
      - "&7一覧から状態ランク0の防具を選択し、確認画面が表示された場合は実行を確定する。"
      - "&7強化の成功率と失敗時の挙動は防具ごとに異なる。"
      - "&a強化に成功すると、防具が1段階強化される。"
    condition:
      type: ORB_USED
      targetId: 40a00001
  - id: use_freya_orb
    text: "&f{item:40a00002}&fでアクセサリを強化する"
    details:
      - "&7インベントリで{item:40a00002}&7をクリックする。"
      - "&7一覧から状態ランク0のアクセサリを選択し、確認画面が表示された場合は実行を確定する。"
      - "&7強化の成功率と失敗時の挙動はアクセサリごとに異なる。"
      - "&a強化に成功すると、アクセサリが1段階強化される。"
    condition:
      type: ORB_USED
      targetId: 40a00002
  - id: use_bragi_orb
    text: "&f{item:40a00006}&fでシジルを装着する"
    details:
      - "&7インベントリで{item:40a00006}&7をクリックする。"
      - "&7一覧からシジルを装着する習得済みスキルを選び、所持シジルを選択する。"
      - "&aオーブとシジルを1個ずつ消費し、選択したスキルに装着する。"
    condition:
      type: ORB_USED
      targetId: 40a00006
  - id: use_mimir_orb
    text: "&f{item:40a00010}&fでシジルを取り外す"
    details:
      - "&7インベントリで{item:40a00010}&7をクリックする。"
      - "&7一覧からシジルを取り外す習得済みスキルを選択する。"
      - "&aオーブを1個消費し、装着済みのシジルを取り外してインベントリへ返却する。"
    condition:
      type: ORB_USED
      targetId: 40a00010
  - id: use_urd_orb
    text: "&f{item:40a00004}&fでルーンを取り外す"
    details:
      - "&7インベントリで{item:40a00004}&7をクリックする。"
      - "&7一覧からルーンを取り外す装備を選択する。"
      - "&a装着済みのルーンを取り外し、インベントリへ返却する。"
    condition:
      type: ORB_USED
      targetId: 40a00004
  - id: use_verdandi_orb
    text: "&f{item:40a00005}&fでルーンを装着する"
    details:
      - "&7インベントリで{item:40a00005}&7をクリックする。"
      - "&7一覧からルーンを装着する装備を選び、所持ルーンを選択する。"
      - "&aルーンを1個消費し、選択した装備に装着する。"
    condition:
      type: ORB_USED
      targetId: 40a00005
