# design:
#   motif: "星律 / 基礎装備のランダム刻印"
#   progression: 1
# 攻防の汎用値は専用種別より控えめ。割合・基本能力・リソースは別の尺度で抽選する。
# SCALARは同じ装備の同status加算値へ適用する乗数。加算元がない場合は効果を持たない。
# アクセサリーはFLATを半減、SCALARは1を超える増加分を半減し、共通候補を重複させない。
# 無属性の増加・耐性・耐性上限補正は、火・氷・雷の補正より小さくする。
