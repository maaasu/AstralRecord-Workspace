    scales: {STRENGTH: 1.10, NORMAL_ATTACK_DAMAGE_INCREASE: 1.35, ENERGY_REGEN: 1.20, MAX_HEALTH: 0.90, VITALITY: 0.95, DEFENSE: 0.90}
    presets: [swordmaster_sword_dance, swordmaster_sword_saint]
  sharpshooter:
