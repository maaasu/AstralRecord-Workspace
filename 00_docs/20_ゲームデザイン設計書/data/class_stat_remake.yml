    presets: [wizard_arcane, wizard_elemental_combo, wizard_prism_sustain]
  archmage:
    mainStats: [INTELLIGENCE]
    scales: {SUPPORT_POWER: 1.50, MAX_MANA: 1.25, MP_REGEN: 1.20, ATTACK: 0.80, VITALITY: 0.95}
    presets: [archmage_area_support, archmage_position_control, archmage_astral_finisher]
  royal_crusader:
    mainStats: [STRENGTH]
    scales: {MAX_HEALTH: 1.20, VITALITY: 1.35, DEFENSE: 1.25, SUPPORT_POWER: 1.30, ATTACK: 0.80, AGILITY: 0.80}
    presets: [royal_crusader_guardian, royal_crusader_holy]
  grandmaster:
    mainStats: [STRENGTH]
    scales: {STRENGTH: 1.15, SKILL_DAMAGE_INCREASE: 1.25, ENERGY_REGEN: 1.25, MAX_ENERGY: 1.15, VITALITY: 0.95, DEFENSE: 0.85}
    presets: [grandmaster_sword_dance, grandmaster_sword_saint]
  elemental_shooter:
