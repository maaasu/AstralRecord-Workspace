schemaVersion: 1
builds:
  lv25_melee_standard:
    role: 近接前衛
    playerLevel: 25

# 配分の重みは職業、スキルツリー、装備の順。
# title と series は 02 の表示名。names を省略すると title を表示する。
groups:
  - name: 基本ステータス
    panels:
      - {title: 基準攻撃力, mode: attack, sources: [共通攻撃力, 近接攻撃力]}
      - {title: 最大HP, weights: [30, 10, 20], derived: {stat: 体力, factor: 2}}
      - {title: 共通防御, weights: [20, 5, 177], derived: {stat: 体力, factor: 1}}
  - name: 会心
    panels:
      - {title: 通常会心率, mode: derived, derived: {stat: 幸運, factor: 0.1}}
      - {title: 会心ダメージ, mode: fixed}
      - {title: 超星会心率, mode: zero}
      - {title: 超星会心倍率, mode: fixed}
  - name: 基本能力値
    panels:
      - {title: 筋力・器用さ・知力, names: [筋力, 器用さ, 知力], weights: [55, 20, 5]}
      - {title: 体力, weights: [80, 20, 0]}
      - {title: 敏捷性, weights: [50, 30, 5]}
      - {title: 幸運, mode: fixed}
  - name: MP・ENG・自然回復
    panels:
      - {title: 最大MP, weights: [45, 15, 10]}
      - {title: 最大ENG, weights: [35, 15, 10]}
      - {title: HP自然回復量（5秒ごと）, weights: [30, 20, 30], derived: {stat: 体力, factor: 0.1}}
      - {title: MP自然回復量（5秒ごと）, weights: [35, 30, 15]}
      - {title: ENG自然回復量（5秒ごと）, weights: [35, 25, 15]}
  - name: 速度・回避・報酬
    panels:
      - {title: 攻撃速度, mode: derived, derived: {stat: 敏捷性, factor: 1}}
      - {title: 移動速度, mode: derived, derived: {stat: 敏捷性, factor: 0.1, cap: 移動速度上限}}
      - {title: 移動速度, series: 上限, names: [移動速度上限], mode: fixed}
      - {title: 回避率, mode: derived, derived: {stat: 敏捷性, factor: 0.1}}
      - {title: 直接ドロップ倍率, mode: derived, derived: {stat: 幸運, factor: 0.01}}
      - {title: EXP獲得量増加率・ドロップ増加率, names: [EXP獲得量増加率, ドロップ増加率], mode: fixed}
  - name: 攻撃力・攻撃補正
    panels:
      - {title: 共通攻撃力・種別攻撃力, series: 共通, names: [共通攻撃力], weights: [55, 20, 0]}
      - {title: 共通攻撃力・種別攻撃力, series: 種別, names: [近接攻撃力, 間接攻撃力, 魔法攻撃力], mode: equipment, weights: [0, 0, 100]}
      - {title: 命中率, weights: [10, 15, 25]}
      - {title: 通常攻撃・スキルダメージ増加, names: [通常攻撃ダメージ増加], weights: [10, 45, 45]}
      - {title: 通常攻撃・スキルダメージ増加, names: [スキルダメージ増加], weights: [35, 50, 15]}
      - {title: 最終ダメージ倍率, weights: [35, 35, 20]}
      - {title: 通常攻撃劣化遅延, weights: [0, 100, 0]}
      - {title: HP固定ダメージ, mode: zero}
      - {title: 共通・種別防御貫通率, names: [共通防御貫通率, 近接防御貫通率, 間接防御貫通率, 魔法防御貫通率], mode: zero}
      - {title: ライフスティール, mode: zero}
  - name: 追加防御・シールド
    panels:
      - {title: 近接・間接防御力, names: [近接防御力, 間接防御力], mode: zero}
      - {title: 被ダメージ軽減率, mode: zero}
      - {title: ノックバック耐性, weights: [0, 30, 70]}
      - {title: 魔法防御力, weights: [0, 30, 70], derived: {stat: 体力, factor: 1}}
      - {title: 最大シールド, mode: zero}
      - {title: シールドブレイク, weights: [0, 25, 75]}
      - {title: シールドリチャージ加算値, mode: zero}
      - {title: シールドリチャージ短縮, mode: zero}
  - name: 属性補正
    panels:
      - {title: 無属性耐性, weights: [0, 15, 50]}
      - {title: 火・氷・雷属性耐性, names: [火属性耐性, 氷属性耐性, 雷属性耐性], weights: [0, 15, 50]}
      - {title: 無属性耐性, series: 上限, names: [無属性耐性上限], mode: fixed}
      - {title: 火・氷・雷属性耐性, series: 上限, names: [火属性耐性上限, 氷属性耐性上限, 雷属性耐性上限], mode: fixed}
      - {title: 無属性ダメージ増加, weights: [20, 35, 45]}
      - {title: 火・氷・雷属性ダメージ増加, names: [火属性ダメージ増加, 氷属性ダメージ増加, 雷属性ダメージ増加], weights: [20, 35, 45]}
      - {title: 属性貫通, names: [火属性貫通, 氷属性貫通, 雷属性貫通], mode: zero}
  - name: 状態異常
    panels:
      - title: 状態異常付与確率増加
        names: [燃焼付与確率増加, 凍結付与確率増加, 冷気付与確率増加, 感電付与確率増加, 毒状態付与確率増加, 盲目付与確率増加, 衰弱付与確率増加, 回復阻害付与確率増加]
        mode: zero
      - title: 状態異常付与耐性
        names: [燃焼付与耐性, 凍結付与耐性, 冷気付与耐性, 感電付与耐性, 毒状態付与耐性, 盲目付与耐性, 衰弱付与耐性, 回復阻害付与耐性]
        weights: [0, 40, 60]
      - {title: 継続ダメージ増加, names: [燃焼継続ダメージ増加, 感電継続ダメージ増加, 毒状態継続ダメージ増加], mode: zero}
      - {title: 継続ダメージ耐性の貫通, names: [燃焼継続ダメージ貫通, 感電継続ダメージ貫通, 毒状態継続ダメージ貫通], mode: zero}
      - {title: 継続ダメージ耐性, names: [燃焼継続ダメージ耐性, 感電継続ダメージ耐性, 毒状態継続ダメージ耐性], weights: [0, 25, 75]}
  - name: スキル・消耗品
    panels:
      - {title: クールダウン・詠唱時間短縮, names: [クールダウン短縮, 詠唱時間短縮], weights: [10, 55, 35]}
      - {title: MP・ENG消費軽減率, names: [MP消費軽減率, ENG消費軽減率], weights: [25, 55, 20]}
      - {title: 支援力, weights: [45, 45, 10]}
      - {title: 回復量増加, mode: zero}
      - {title: 状態異常持続時間増加, mode: zero}
      - {title: バフ持続時間増加, weights: [20, 60, 20]}
      - {title: 消耗品使用時移動許容距離, mode: zero}
      - {title: 消耗品使用時移動減速率, mode: zero}

mob:
  - {title: 標準モブの最大HP, series: 最大HP, name: 最大HP}
  - {title: 標準モブの防御, series: 共通防御, name: 共通防御}
  - {title: 標準モブの防御, series: 追加防御, name: 追加防御}
  - {title: 標準モブの回避率, name: 回避率}
  - {title: 標準モブの属性耐性, series: 基礎耐性, name: 属性耐性（基礎）}
  - {title: 標準モブの属性耐性, series: 補正込み上限, name: 属性耐性（上限）}
  - {title: 標準モブのシールドブレイク, name: シールドブレイク}
  - {title: 無属性の通常攻撃, series: モブ攻撃力, name: 無属性の通常攻撃力}
  - {title: 無属性の通常攻撃, series: 被ダメージ, name: 無属性の通常攻撃の被ダメージ}
  - {title: 火・氷・雷の通常攻撃, series: モブ攻撃力, name: 火・氷・雷の通常攻撃力}
  - {title: 火・氷・雷の通常攻撃, series: 被ダメージ, name: 火・氷・雷の通常攻撃の被ダメージ}
