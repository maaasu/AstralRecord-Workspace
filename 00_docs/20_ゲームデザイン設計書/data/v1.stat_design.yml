schemaVersion: 1

# 配分の重みは職業、スキルツリー、装備の順。
# title と series は 02 の表示名。names を省略すると title を表示する。
groups:
  - name: 基本ステータス
    panels:
      - {title: 基準攻撃力, mode: attack, sources: [共通攻撃力, 近接攻撃力]}
      - {title: 最大HP, weights: [30, 10, 20], derived: {stat: 体力, factor: 2}}
      - {title: 共通防御, weights: [20, 5, 177], derived: {stat: 体力, factor: 1}}
  - name: 会心
    panels:
      - {title: 通常会心率, mode: derived, derived: {stat: 幸運, factor: 0.1}}
      - {title: 会心ダメージ, mode: fixed}
      - {title: 超星会心率, mode: zero}
      - {title: 超星会心倍率, mode: fixed}
  - name: 基本能力値
    panels:
      - {title: 筋力・器用さ・知力, names: [筋力, 器用さ, 知力], weights: [55, 20, 5]}
      - {title: 体力, weights: [80, 20, 0]}
      - {title: 敏捷性, weights: [50, 30, 5]}
      - {title: 幸運, mode: fixed}
  - name: MP・ENG・自然回復
    panels:
      - {title: 最大MP, weights: [45, 15, 10]}
      - {title: 最大ENG, weights: [35, 15, 10]}
      - {title: HP自然回復量（5秒ごと）, weights: [30, 20, 30], derived: {stat: 体力, factor: 0.1}}
      - {title: MP自然回復量（5秒ごと）, weights: [35, 30, 15]}
      - {title: ENG自然回復量（5秒ごと）, weights: [35, 25, 15]}
  - name: 速度・回避・報酬
    panels:
      - {title: 攻撃速度, mode: derived, derived: {stat: 敏捷性, factor: 1}}
      - {title: 移動速度, mode: derived, derived: {stat: 敏捷性, factor: 0.1, cap: 移動速度上限}}
      - {title: 移動速度, series: 上限, names: [移動速度上限], mode: fixed}
      - {title: 回避率, mode: derived, derived: {stat: 敏捷性, factor: 0.1}}
      - {title: 直接ドロップ倍率, mode: derived, derived: {stat: 幸運, factor: 0.01}}
      - {title: EXP獲得量増加率・ドロップ増加率, names: [EXP獲得量増加率, ドロップ増加率], mode: fixed}
  - name: 攻撃力・攻撃補正
    panels:
      - {title: 共通攻撃力・種別攻撃力, series: 共通, names: [共通攻撃力], weights: [55, 20, 0]}
      - {title: 共通攻撃力・種別攻撃力, series: 種別, names: [近接攻撃力, 間接攻撃力, 魔法攻撃力], mode: equipment, weights: [0, 0, 100]}
      - {title: 命中率, weights: [10, 15, 25]}
      - {title: 通常攻撃・スキルダメージ増加, names: [通常攻撃ダメージ増加], weights: [10, 45, 45]}
      - {title: 通常攻撃・スキルダメージ増加, names: [スキルダメージ増加], weights: [35, 50, 15]}
      - {title: 最終ダメージ倍率, weights: [35, 35, 20]}
      - {title: 通常攻撃劣化遅延, weights: [0, 100, 0]}
      - {title: HP固定ダメージ, mode: zero}
      - {title: 共通・種別防御貫通率, names: [共通防御貫通率, 近接防御貫通率, 間接防御貫通率, 魔法防御貫通率], mode: zero}
      - {title: ライフスティール, mode: zero}
  - name: 追加防御・シールド
    panels:
      - {title: 近接・間接防御力, names: [近接防御力, 間接防御力], mode: zero}
      - {title: 被ダメージ軽減率, mode: zero}
      - {title: ノックバック耐性, weights: [0, 30, 70]}
      - {title: 魔法防御力, weights: [0, 30, 70], derived: {stat: 体力, factor: 1}}
      - {title: 最大シールド, mode: zero}
      - {title: シールドブレイク, weights: [0, 25, 75]}
      - {title: シールドリチャージ加算値, mode: zero}
      - {title: シールドリチャージ短縮, mode: zero}
  - name: 属性補正
    panels:
      - {title: 無属性耐性, weights: [0, 15, 50]}
      - {title: 火・氷・雷属性耐性, names: [火属性耐性, 氷属性耐性, 雷属性耐性], weights: [0, 15, 50]}
      - {title: 無属性耐性, series: 上限, names: [無属性耐性上限], mode: fixed}
      - {title: 火・氷・雷属性耐性, series: 上限, names: [火属性耐性上限, 氷属性耐性上限, 雷属性耐性上限], mode: fixed}
      - {title: 無属性ダメージ増加, weights: [20, 35, 45]}
      - {title: 火・氷・雷属性ダメージ増加, names: [火属性ダメージ増加, 氷属性ダメージ増加, 雷属性ダメージ増加], weights: [20, 35, 45]}
      - {title: 属性貫通, names: [火属性貫通, 氷属性貫通, 雷属性貫通], mode: zero}
  - name: 状態異常
    panels:
      - title: 状態異常付与確率増加
        names: [燃焼付与確率増加, 凍結付与確率増加, 冷気付与確率増加, 感電付与確率増加, 毒状態付与確率増加, 盲目付与確率増加, 衰弱付与確率増加, 回復阻害付与確率増加]
        mode: zero
      - title: 状態異常付与耐性
        names: [燃焼付与耐性, 凍結付与耐性, 冷気付与耐性, 感電付与耐性, 毒状態付与耐性, 盲目付与耐性, 衰弱付与耐性, 回復阻害付与耐性]
        weights: [0, 40, 60]
      - {title: 継続ダメージ増加, names: [燃焼継続ダメージ増加, 感電継続ダメージ増加, 毒状態継続ダメージ増加], mode: zero}
      - {title: 継続ダメージ耐性の貫通, names: [燃焼継続ダメージ貫通, 感電継続ダメージ貫通, 毒状態継続ダメージ貫通], mode: zero}
      - {title: 継続ダメージ耐性, names: [燃焼継続ダメージ耐性, 感電継続ダメージ耐性, 毒状態継続ダメージ耐性], weights: [0, 25, 75]}
  - name: スキル・消耗品
    panels:
      - {title: クールダウン・詠唱時間短縮, names: [クールダウン短縮, 詠唱時間短縮], weights: [10, 55, 35]}
      - {title: MP・ENG消費軽減率, names: [MP消費軽減率, ENG消費軽減率], weights: [25, 55, 20]}
      - {title: 支援力, weights: [45, 45, 10]}
      - {title: 回復量増加, mode: zero}
      - {title: 状態異常持続時間増加, mode: zero}
      - {title: バフ持続時間増加, weights: [20, 60, 20]}
      - {title: 消耗品使用時移動許容距離, mode: zero}
      - {title: 消耗品使用時移動減速率, mode: zero}

relativeRates:
  - - 適用順
    - 固定加算・基本能力値からの派生・スキル個体の補正を合計し、相対増加率を一度掛ける。
      倍率の下限は0。各判定の上限は最後に適用する。補正前の値が0なら補正後も0。
  - - 装備とスキルツリー
    - 元IDへのFLATはポイント加算。通常会心率5%に元IDで5ポイントを加えると10%。
      相対増加は別IDへのFLATで指定する。通常会心率5%に相対増加100%を付けても10%になる。
  - - 攻撃元
    - 共通のCRITICAL_RATE_RELATIVE_INCREASEに、攻撃元に応じて
      NORMAL_ATTACK_CRITICAL_RATE_RELATIVE_INCREASEまたは
      SKILL_CRITICAL_RATE_RELATIVE_INCREASEを足す。
      職業スキルにはシジル装着の有無を問わずスキル限定が適用される。
      通常会心と超星会心はそれぞれ独立して判定する。
  - - 対象
    - 会心率・会心ダメージ・超星会心率・超星会心倍率、命中率・回避率・攻撃速度、
      ライフスティール、シールドリチャージ加算率、共通・種別防御貫通、属性耐性と火・氷・雷の属性貫通。
  - - 対象（続き）
    - 状態異常の付与耐性、燃焼・感電・毒の継続ダメージ耐性と貫通、ノックバック耐性、
      被ダメージ軽減率、CT・詠唱・シールドリチャージの短縮、MP・ENG消費軽減。
  - - 対象外
    - 通常攻撃・スキル・属性・継続ダメージ、回復量、持続時間、状態異常付与確率の増加は既存の補正。
      最終ダメージ・EXP・ドロップは既存の倍率。耐性上限は制限値、消耗品使用時移動減速率はペナルティ。
      これらと相対増加自体には相対増加IDを生成しない。

equipment:
  relativeCandidates:
    通常攻撃会心率の相対増加:
      base: 通常会心率
      id: NORMAL_ATTACK_CRITICAL_RATE_RELATIVE_INCREASE
    スキル会心率の相対増加:
      base: 通常会心率
      id: SKILL_CRITICAL_RATE_RELATIVE_INCREASE
  unlockLevels: {advanced: 50, build: 25, lateBuild: 75}
  twoHanded: {sharePercent: 50, exampleLevel: 25}
  standardArmor:
    exampleLevel: 25
    weights: {頭: 20, 胴: 35, 脚: 30, 足: 15}
    chestOffset: 6
  pools:
    主能力: {stats: [筋力, 器用さ, 知力]}
    通常会心: {stats: [通常会心率, 会心ダメージ]}
    超星会心: {stats: [超星会心率, 超星会心倍率]}
    近接・間接防御力: {stats: [近接防御力, 間接防御力]}
    属性ダメージ増加: {stats: [無属性ダメージ増加, 火属性ダメージ増加, 氷属性ダメージ増加, 雷属性ダメージ増加]}
    属性耐性: {stats: [無属性耐性, 火属性耐性, 氷属性耐性, 雷属性耐性]}
    属性貫通: {stats: [火属性貫通, 氷属性貫通, 雷属性貫通]}
    状態異常付与確率増加:
      stats: [燃焼付与確率増加, 凍結付与確率増加, 冷気付与確率増加, 感電付与確率増加, 毒状態付与確率増加, 盲目付与確率増加, 衰弱付与確率増加, 回復阻害付与確率増加]
    状態異常付与耐性:
      stats: [燃焼付与耐性, 凍結付与耐性, 冷気付与耐性, 感電付与耐性, 毒状態付与耐性, 盲目付与耐性, 衰弱付与耐性, 回復阻害付与耐性]
    継続ダメージ増加: {stats: [燃焼継続ダメージ増加, 感電継続ダメージ増加, 毒状態継続ダメージ増加]}
    継続ダメージ貫通: {stats: [燃焼継続ダメージ貫通, 感電継続ダメージ貫通, 毒状態継続ダメージ貫通]}
    継続ダメージ耐性: {stats: [燃焼継続ダメージ耐性, 感電継続ダメージ耐性, 毒状態継続ダメージ耐性]}
    育成・探索報酬: {stats: [EXP獲得量増加率, ドロップ増加率]}
    消耗品使用中の移動:
      stats: [消耗品使用時移動許容距離, 消耗品使用時移動減速率]
      together: true
  sections:
    武器:
      - name: 剣
        icon: sword
        role: 通常攻撃を軸に、手数と会心を伸ばす。
        required: [近接攻撃力]
        normal: [筋力, 命中率, 通常攻撃ダメージ増加]
        advanced: [スキルダメージ増加, シールドブレイク]
        build: [攻撃速度, 通常会心, 近接防御貫通率, 通常攻撃会心率の相対増加]
        lateBuild: [ライフスティール]
      - name: ハンマー
        icon: hammer
        role: 敵のシールドを崩す。
        required: [近接攻撃力]
        twoHandedBonus: シールドブレイク
        normal: [筋力, 最大ENG, スキルダメージ増加]
        advanced: [命中率, 通常攻撃ダメージ増加]
        build: [近接防御貫通率, 状態異常付与確率増加]
        lateBuild: [HP固定ダメージ]
      - name: 槍
        icon: spear
        role: 近接スキルを当て、状態異常と継続ダメージにつなぐ。
        required: [近接攻撃力]
        normal: [筋力, 命中率, スキルダメージ増加]
        advanced: [通常攻撃ダメージ増加, シールドブレイク]
        build: [近接防御貫通率, 状態異常付与確率増加, 継続ダメージ増加]
        lateBuild: [継続ダメージ貫通]
      - name: 弓
        icon: bow
        role: 離れた敵に通常攻撃を当て、会心や属性で威力を伸ばす。
        required: [間接攻撃力]
        normal: [器用さ, 命中率, 通常攻撃ダメージ増加]
        advanced: [スキルダメージ増加, シールドブレイク]
        build: [通常会心, 間接防御貫通率, 属性ダメージ増加]
      - name: 短弓
        icon: shortbow
        role: 素早く動き、手数を生かして状態異常を狙う。
        required: [間接攻撃力]
        normal: [器用さ, 敏捷性, 通常攻撃ダメージ増加]
        advanced: [命中率, スキルダメージ増加]
        build: [攻撃速度, 状態異常付与確率増加, 継続ダメージ増加]
      - name: 長弓
        alias: ロングボウ
        icon: longbow
        role: 精密射撃で会心を狙う。
        required: [間接攻撃力]
        twoHandedBonus: 命中率
        normal: [器用さ, 通常攻撃ダメージ増加]
        advanced: [スキルダメージ増加, シールドブレイク]
        build: [通常会心, 間接防御貫通率]
        lateBuild: [超星会心]
      - name: ワンド
        icon: wand
        role: 属性魔法を使い、詠唱の短縮や消費MPの軽減を図る。
        required: [魔法攻撃力]
        normal: [知力, 最大MP, 属性ダメージ増加]
        advanced: [詠唱時間短縮, スキルダメージ増加]
        build: [MP消費軽減率, 魔法防御貫通率, 状態異常付与確率増加, スキル会心率の相対増加]
      - name: スタッフ
        icon: staff
        role: MPを確保し、攻撃・支援魔法を続ける。
        required: [魔法攻撃力]
        twoHandedBonus: 最大MP
        normal: [知力, スキルダメージ増加, MP消費軽減率]
